<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151714" />
    <meta
      name="description"
      content="Find your purrfect rhythm. Discover curated sounds, make playlists, and listen to your own music with Meowtify."
    />
    <title>Meowtify — Find your purrfect rhythm</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-action="focus-main">Skip to music</a>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Meowtify home"
        ><img src="assets/favicon.svg" alt="" width="36" height="36" /><span
          >meowtify<span class="brand-dot">.</span></span
        ></a
      >
      <div class="side-label">YOUR LITTLE SOUNDTRACK</div>
      <nav id="primary-nav"></nav>
      <div class="library-heading">
        <span>Your library</span
        ><button
          class="icon-button"
          data-action="create-playlist"
          aria-label="Create playlist"
          title="Create playlist"
        >
          <span data-icon="plus"></span>
        </button>
      </div>
      <nav id="library-nav" aria-label="Library"></nav>
      <div class="sidebar-bottom">
        <div class="local-callout">
          <span data-icon="music"></span><strong>Your music, at home.</strong>
          <p>Bring your favorite files.<br />We’ll bring the good vibes.</p>
          <button class="subtle-button" data-action="import">
            Import music <span data-icon="plus"></span>
          </button>
        </div>
        <button class="about-link" data-action="about">
          <span data-icon="info"></span> About Meowtify</button
        ><span class="byline">MADE WITH A LITTLE CATTITUDE</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="page-label" id="page-label">Discover</div>
        <label class="search-box"
          ><span data-icon="search"></span
          ><input
            id="search"
            type="search"
            placeholder="What sounds good today?"
            aria-label="Search songs, artists, and mixes"
            autocomplete="off"
          /><kbd>/</kbd></label
        ><button
          class="icon-button top-import"
          data-action="import"
          aria-label="Import music"
          title="Import music"
        >
          <span data-icon="upload"></span></button
        ><button
          class="profile"
          data-action="about"
          aria-label="About your local library"
        >
          J
        </button>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading">Finding the good sounds…</div>
      </main>
    </div>
    <aside
      class="queue-drawer"
      id="queue-drawer"
      aria-label="Play queue"
      hidden
    ></aside>
    <footer class="player" aria-label="Music player">
      <div class="now-playing">
        <img
          id="now-art"
          src="assets/mix-3.svg"
          alt=""
          width="54"
          height="54"
        />
        <div class="now-copy">
          <strong id="now-title">Pick something good</strong
          ><span id="now-artist">Your next favorite is waiting</span>
        </div>
        <button
          id="now-like"
          class="icon-button"
          data-action="like-current"
          aria-label="Like current song"
          disabled
        >
          <span data-icon="heart"></span>
        </button>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button
            id="shuffle"
            class="icon-button"
            data-action="shuffle"
            aria-label="Shuffle"
            aria-pressed="false"
            title="Shuffle"
          >
            <span data-icon="shuffle"></span></button
          ><button
            class="icon-button"
            data-action="previous"
            aria-label="Previous track"
            title="Previous track"
          >
            <span data-icon="previous"></span></button
          ><button
            id="play-toggle"
            class="play-button"
            data-action="toggle"
            aria-label="Play"
            title="Play / pause (Space)"
          >
            <span data-icon="play"></span></button
          ><button
            class="icon-button"
            data-action="next"
            aria-label="Next track"
            title="Next track"
          >
            <span data-icon="next"></span></button
          ><button
            id="repeat"
            class="icon-button"
            data-action="repeat"
            aria-label="Repeat off"
            aria-pressed="false"
            title="Repeat off"
          >
            <span data-icon="repeat"></span>
          </button>
        </div>
        <div class="seek-row">
          <span id="elapsed">0:00</span
          ><input
            id="seek"
            type="range"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek through song"
            disabled
          /><span id="duration">0:00</span>
        </div>
      </div>
      <div class="player-extras">
        <button
          id="queue-toggle"
          class="icon-button"
          data-action="queue-toggle"
          aria-label="Show queue"
          aria-expanded="false"
          title="Queue"
        >
          <span data-icon="queue"></span></button
        ><span class="control-divider"></span
        ><button
          id="mute"
          class="icon-button"
          data-action="mute"
          aria-label="Mute"
          title="Mute"
        >
          <span data-icon="volume"></span></button
        ><input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
          aria-label="Volume"
        />
      </div>
    </footer>
    <div id="playback-error" class="playback-error" role="alert" hidden>
      <span>Couldn’t play this track.</span
      ><button data-action="retry">Retry</button
      ><button data-action="next">Next track</button
      ><button data-action="dismiss-error" aria-label="Dismiss playback error">
        ×
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <input
      id="file-input"
      type="file"
      accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac"
      multiple
      hidden
    />
    <audio id="audio" preload="metadata"></audio>
    <noscript
      >Meowtify needs JavaScript to play music and manage your
      library.</noscript
    >
  </body>
</html>
